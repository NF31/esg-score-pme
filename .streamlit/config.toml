# Limite la taille des fichiers uploades (F14 : rapport RSE PDF) pour eviter l'abus de
# l'API Anthropic (payante) via des uploads volumineux repetes -- app publique sans
# authentification, cf. docs/STACK.md.
[server]
maxUploadSize = 10

[theme]
base = "light"
primaryColor = "#0F766E"
linkColor = "#0F766E"
chartCategoricalColors = ["#0F766E", "#2563EB", "#D97706", "#7C3AED"]
