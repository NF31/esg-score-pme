[project]
name = "esg-score-pme"
version = "0.1.0"
description = "Outil de diagnostic et scoring ESG/RSE pour PME"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.111",
    "httpx>=0.28.1",
    "pandas>=2.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "reportlab>=5.0.1",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.63.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
